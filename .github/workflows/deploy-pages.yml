name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a deploy that is already shipping.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          
      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Run tests
        # Starfield.esm integration tests skip automatically: the resource is gitignored.
        run: dotnet test

      - name: Publish (Release, WASM AOT)
        run: dotnet publish src/EsmParser.Web -c Release -o publish

      - name: Adjust site for GitHub Pages hosting
        run: |
          set -euo pipefail
          site=publish/wwwroot
          repo="${GITHUB_REPOSITORY#*/}"

          # Project pages are served from /<repo>/, so the document base must match.
          # User/organization pages (<owner>.github.io) stay at the root.
          if [[ "$repo" != *.github.io ]]; then
            sed -i "s|<base href=\"/\" />|<base href=\"/${repo}/\" />|" "$site/index.html"
          fi

          # SPA fallback so deep links (e.g. /explore) resolve, and .nojekyll so
          # Pages serves the underscore-prefixed _framework directory.
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
